[project]
name = "trickle-down"
version = "0.2.0"
description = "Testing Statistical Hypotheses in a Tree-Like Hierarchy"
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Bob Wilson", email = "bob.wilson@convexanalytics.com" },
]
maintainers = [
    { name = "Bob Wilson" },
]
requires-python = ">=3.11"
keywords = ["statistics", "multiple testing", "familywise error rate", "uplift"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=2.0,<3",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "eon>=1.2",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.5",
    "types-tabulate",
    "types-networkx",
    # Reproducing the paper's simulation study (paper/).
    "scikit-learn>=1.5",
    # Documentation (docs/).
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.17.1",
    "myst-parser>=3.0",
]

[project.urls]
Source = "https://github.com/rwilson4/trickle-down"
Paper = "https://arxiv.org/abs/2610.37966"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trickle_down"]

[tool.hatch.build.targets.sdist]
include = [
    "trickle_down",
    "tests",
    "paper",
    "docs",
    "README.md",
    "LICENSE.txt",
    "changelog.txt",
    "CLAUDE.md",
]

[tool.mypy]
python_version = "3.11"
files = ["trickle_down", "paper"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
# scipy and EoN lack complete type stubs; accept their calls without
# type-checking but require our own code to be fully annotated.
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# scipy-stubs requires Python 3.12, and this project supports 3.11;
# EoN ships no type information.
module = ["EoN.*", "scipy", "scipy.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["trickle_down"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.format]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "B007",
    "B008",
    "RUF046",
    "RUF059",
    "SIM108",
    "SIM113",
]

[tool.ruff.lint.isort]
# Sort names case-insensitively within an import, as the codebase does,
# rather than grouping constants, classes and functions.
order-by-type = false
known-first-party = ["trickle_down", "paper"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
