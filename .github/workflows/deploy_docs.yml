name: deploy-docs
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'trickle_down/**'
      - 'paper/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/deploy_docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'trickle_down/**'
      - 'paper/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Deployment is skipped (the build and doctests still run) until these
      # repository secrets are configured.
      DOCS_HOST: ${{ secrets.DOCS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Build docs
        run: cd docs && uv run make html SPHINXOPTS="-W --keep-going"

      # The exact results the guides quote from the paper are doctests.
      - name: Run doctests
        run: cd docs && uv run make doctest

      - name: Set up SSH key
        if: github.event_name != 'pull_request' && env.DOCS_HOST != ''
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DOCS_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DOCS_HOST }}" >> ~/.ssh/known_hosts

      # The deploy key's forced command (rrsync) fixes the destination
      # directory on the server, so the destination here is a bare colon.
      - name: Deploy docs via rsync
        if: github.event_name != 'pull_request' && env.DOCS_HOST != ''
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            docs/_build/html/ \
            ${{ secrets.DOCS_USER }}@${{ secrets.DOCS_HOST }}:
